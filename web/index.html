<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam 国服二游启动器</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card2: #1d222c;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8b93a5;
    --accent: #4f8cff;
    --accent-h: #6ba0ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #141820, #10141b);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .badge.ok .dot { background: var(--green); }
  .badge.warn .dot { background: var(--yellow); }
  .badge.err .dot { background: var(--red); }

  main { max-width: 1080px; margin: 0 auto; padding: 20px 24px 60px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 15px; margin: 0 0 14px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 180px; flex: 1; }
  .field label { font-size: 12px; color: var(--muted); }
  input, select {
    background: var(--card2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: #5a6273; }

  button {
    background: var(--card2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
    transition: all .12s ease; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); background: #232936; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-h); }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .game {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .game .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .game .name { font-weight: 600; font-size: 15px; }
  .game .id { font-size: 11px; color: var(--muted); font-family: Consolas, monospace; }
  .status { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; }
  .status.found .dot { background: var(--green); }
  .status.miss .dot { background: var(--muted); }
  .status.found { color: var(--green); }
  .status.miss { color: var(--muted); }
  .path { font-size: 11px; color: var(--muted); font-family: Consolas, monospace; word-break: break-all; background: var(--card2); padding: 6px 8px; border-radius: 6px; }
  .game .field input { width: 100%; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions .grow { flex: 1 1 auto; }

  #toast-wrap { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
  .toast { background: var(--card2); border: 1px solid var(--border); border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: 8px; max-width: 380px; box-shadow: 0 6px 24px rgba(0,0,0,.4); animation: slidein .2s ease; }
  .toast.ok { border-left-color: var(--green); }
  .toast.err { border-left-color: var(--red); }
  .toast b { display: block; margin-bottom: 2px; }
  .toast .msg { color: var(--muted); font-size: 12px; word-break: break-all; }
  @keyframes slidein { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

  .switch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { width: auto; }
  .hint { font-size: 12px; color: var(--muted); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--muted); text-align: center; padding: 30px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🎮 Steam 国服二游启动器</h1>
    <div class="sub">定位客户端 · 直接启动 / 官方启动器 / 经 Steam 启动 · 加入 Steam 库</div>
  </div>
  <div id="steam-badge" class="badge"><span class="dot"></span><span>检测 Steam 中…</span></div>
</header>

<main>
  <section class="panel">
    <h2>⚙️ 全局设置</h2>
    <div class="row">
      <div class="field" style="max-width:220px">
        <label>默认启动方式</label>
        <select id="launch-mode">
          <option value="direct">直接启动游戏</option>
          <option value="launcher">经官方启动器</option>
          <option value="steam">经 Steam 启动</option>
        </select>
      </div>
      <div class="field">
        <label>Steam 目录（留空自动检测）</label>
        <input id="steam-path" placeholder="如 C:\Program Files (x86)\Steam">
      </div>
      <div class="field" style="max-width:180px">
        <label>Steam 账号目录（留空自动）</label>
        <input id="steam-account" placeholder="userdata 账号名">
      </div>
      <label class="switch" title="Steam 运行时也强制写入 shortcuts.vdf">
        <input type="checkbox" id="force-steam"> 强制写入 Steam
      </label>
      <button id="btn-scan">🔄 重新扫描</button>
      <button id="btn-save" class="primary">💾 保存配置</button>
    </div>
  </section>

  <section class="panel">
    <h2>🎮 游戏列表 <span class="hint" id="count-hint"></span></h2>
    <div class="games" id="games"><div class="empty">加载中…</div></div>
  </section>
</main>

<div id="toast-wrap"></div>

<script>
const $ = s => document.querySelector(s);
let state = null;

async function api(path, body) {
  const opt = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' } };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

function toast(title, msg, ok) {
  const w = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (ok === true ? ' ok' : ok === false ? ' err' : '');
  el.innerHTML = '<b>' + esc(title) + '</b>' + (msg ? '<div class="msg">' + esc(msg) + '</div>' : '');
  w.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 5000);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function refresh() {
  try {
    state = await api('/api/state');
    render();
  } catch (e) {
    toast('加载失败', e.message, false);
  }
}

function render() {
  renderSteamBadge();
  $('#launch-mode').value = state.launch_mode || 'direct';
  $('#steam-path').value = state.steam_path || '';
  $('#steam-account').value = state.steam_account || '';
  const games = $('#games');
  games.innerHTML = '';
  if (!state.games.length) { games.innerHTML = '<div class="empty">没有游戏</div>'; return; }
  $('#count-hint').textContent = `（${state.games.filter(g=>g.detected).length}/${state.games.length} 已定位）`;
  for (const g of state.games) games.appendChild(renderCard(g));
}

function renderSteamBadge() {
  const b = $('#steam-badge');
  if (state.steam_found) {
    b.className = 'badge ' + (state.steam_running ? 'warn' : 'ok');
    b.innerHTML = '<span class="dot"></span><span>Steam ' + (state.steam_running ? '运行中' : '已就绪') + '</span>';
  } else {
    b.className = 'badge err';
    b.innerHTML = '<span class="dot"></span><span>未找到 Steam</span>';
  }
}

function renderCard(g) {
  const el = document.createElement('div');
  el.className = 'game';
  el.dataset.id = g.id;

  const found = g.detected;
  el.innerHTML = `
    <div class="head">
      <div>
        <div class="name">${esc(g.name)}</div>
        <div class="id">${esc(g.id)}${g.builtin ? '' : ' · 自定义'}</div>
      </div>
      <div class="status ${found ? 'found' : 'miss'}">
        <span class="dot"></span><span>${found ? '已定位' : '未检测到'}</span>
      </div>
    </div>
    ${found ? `<div class="path">${esc(g.exe_path)}</div>` : ''}
    <div class="field">
      <label>安装路径${found ? '' : '（可手动填写）'}</label>
      <input class="path-input" placeholder="自动检测" value="${esc(g.path || '')}">
    </div>
    <div class="field">
      <label>启动参数（空格分隔）</label>
      <input class="args-input" placeholder="如 -platform_type CN" value="${esc(g.args_str || '')}">
    </div>
    <div class="actions">
      <button class="primary act-launch" ${found || g.path ? '' : 'disabled'} data-mode="direct">▶ 直接启动</button>
      <button class="act-launch" data-mode="launcher" ${g.launcher_exe ? '' : 'disabled'} title="${g.launcher_exe ? '经官方启动器' : '未配置启动器'}">🚀 启动器</button>
      <button class="act-launch" data-mode="steam" ${found || g.path ? '' : 'disabled'}>🕹 Steam 启动</button>
    </div>
    <div class="actions">
      <button class="act-add grow" ${found || g.path ? '' : 'disabled'}>＋ 加入 Steam 库</button>
      <button class="act-remove" ${found || g.path ? '' : 'disabled'}>－ 移除</button>
      <button class="act-uri" ${found || g.path ? '' : 'disabled'}>🔗 URI</button>
    </div>
  `;

  const pathInput = el.querySelector('.path-input');
  const argsInput = el.querySelector('.args-input');

  const readInputs = () => ({ id: g.id, path: pathInput.value.trim(), args: argsInput.value.trim(), force: $('#force-steam').checked });

  el.querySelectorAll('.act-launch').forEach(btn => btn.addEventListener('click', async () => {
    const inp = readInputs();
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      const r = await api('/api/launch', { ...inp, mode: btn.dataset.mode });
      toast('启动成功', r.message, true);
    } catch (e) { toast('启动失败', e.message, false); }
    btn.disabled = false; btn.textContent = btn.dataset.mode === 'direct' ? '▶ 直接启动' : btn.dataset.mode === 'launcher' ? '🚀 启动器' : '🕹 Steam 启动';
  }));

  el.querySelector('.act-add').addEventListener('click', async () => {
    const inp = readInputs(); const btn = el.querySelector('.act-add');
    btn.disabled = true;
    try {
      const r = await api('/api/steam-add', inp);
      toast('已加入 Steam 库', `AppId: ${r.appid}｜URI: ${r.uri}`, true);
    } catch (e) { toast('加入失败', e.message, false); }
    btn.disabled = false;
  });

  el.querySelector('.act-remove').addEventListener('click', async () => {
    const inp = readInputs();
    if (!confirm(`确定从 Steam 库移除「${g.name}」？`)) return;
    try {
      const r = await api('/api/steam-remove', inp);
      toast('已移除', r.message, true);
    } catch (e) { toast('移除失败', e.message, false); }
  });

  el.querySelector('.act-uri').addEventListener('click', async () => {
    const inp = readInputs();
    try {
      const r = await api('/api/steam-uri', inp);
      toast('启动 URI', `${r.uri}\nAppId: ${r.appid}`, true);
    } catch (e) { toast('失败', e.message, false); }
  });

  return el;
}

$('#btn-scan').addEventListener('click', () => { refresh(); toast('已重新扫描'); });
$('#btn-save').addEventListener('click', async () => {
  const games = {};
  document.querySelectorAll('.game').forEach(card => {
    games[card.dataset.id] = {
      path: card.querySelector('.path-input').value.trim(),
      args: card.querySelector('.args-input').value.trim(),
    };
  });
  const body = {
    launch_mode: $('#launch-mode').value,
    steam: { path: $('#steam-path').value.trim(), account_id: $('#steam-account').value.trim() },
    games,
  };
  try {
    const r = await api('/api/save-config', body);
    toast('配置已保存', r.message, true);
    await refresh();
  } catch (e) { toast('保存失败', e.message, false); }
});

refresh();
</script>
</body>
</html>
