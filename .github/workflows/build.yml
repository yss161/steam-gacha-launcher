name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build-windows:
    name: Build Windows (${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, 386]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set version
        id: version
        run: |
          VER="${GITHUB_REF_NAME}"
          if [ "$VER" = "main" ] || [ "$VER" = "master" ]; then
            VER="dev-${GITHUB_SHA::7}"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.ver }}" \
            -o "steam-gacha-launcher-windows-${{ matrix.goarch }}.exe" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-gacha-launcher-windows-${{ matrix.goarch }}
          path: steam-gacha-launcher-windows-${{ matrix.goarch }}.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist
        run: ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
